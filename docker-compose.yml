version: '3.8'

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deterministic-brain
    ports:
      - "8000:8000"
    environment:
      - FACTS_DB_PATH=/app/facts_db.json
      - WORKSPACE_PATH=/app
      - MAX_OUTPUT_TOKENS=500
      - CONFIDENCE_THRESHOLD=0.7
    volumes:
      - ./memory:/app/memory
      - ./facts_db.json:/app/facts_db.json
      - brain_audit:/app/audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  brain_audit:
