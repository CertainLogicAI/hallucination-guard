version: "3.8"

services:
  certainlogic:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BRAIN_API_KEY=${BRAIN_API_KEY:-}
      - HALLUCINATION_GUARD_DATA=/data
    volumes:
      - certainlogic-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  certainlogic-data:
