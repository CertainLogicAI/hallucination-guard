site_name: CertainLogic Verifier
site_description: Deterministic AI verification middleware — catch hallucinations, cut token costs, self-host everything.
site_url: https://certainlogicai.github.io/hallucination-guard
repo_url: https://github.com/CertainLogicAI/hallucination-guard
repo_name: CertainLogicAI/hallucination-guard

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - API Reference:
    - Endpoints: api/endpoints.md
    - Facts Schema: api/facts-schema.md
  - Integrations:
    - LangChain: integrations/langchain.md
    - FastAPI Middleware: integrations/fastapi.md
    - Python SDK: integrations/python-sdk.md
  - Deployment:
    - Docker: deployment/docker.md
    - Kubernetes / Helm: deployment/kubernetes.md
    - Air-Gapped: deployment/air-gapped.md
  - Benchmarks: benchmarks.md
  - Compliance: compliance.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CertainLogicAI/hallucination-guard
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/CertainLogicAI
