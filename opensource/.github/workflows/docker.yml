name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hallucination-guard:ci .

      - name: Smoke test
        run: |
          docker run -d --name hg-smoke -p 8000:8000 hallucination-guard:ci
          sleep 5
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          docker stop hg-smoke

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag hallucination-guard:ci ghcr.io/certainlogicai/hallucination-guard:edge
          docker push ghcr.io/certainlogicai/hallucination-guard:edge
