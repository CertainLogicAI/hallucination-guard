name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort
      - name: Check formatting (black)
        run: black --check --diff src tests
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Import sorting (isort)
        run: isort --check-only --profile black src tests

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=hallucination_guard --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
      - name: Generate coverage badge
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          COV=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'],1))")
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV >= 80" | bc -l) )); then COLOR="brightgreen"
          elif (( $(echo "$COV >= 60" | bc -l) )); then COLOR="yellow"
          else COLOR="red"; fi
          mkdir -p .badges
          cat > .badges/coverage.json <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${COV}%","color":"${COLOR}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .badges/coverage.json
          git diff --cached --quiet || git commit -m "Update coverage badge [skip ci]" && git push || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Verify package
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hallucination-guard:test .
      - name: Smoke test container
        run: |
          docker run -d --name hg-test -p 8000:8000 hallucination-guard:test
          sleep 10
          docker logs hg-test
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"' || {
            echo "Health check failed. Container logs:"
            docker logs hg-test
            exit 1
          }
          docker stop hg-test
