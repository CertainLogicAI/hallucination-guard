[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-guard"
version = "0.1.0"
description = "Deterministic AI verification middleware that catches hallucinations and cuts token costs."
requires-python = ">=3.11"
keywords = ["AI", "hallucination detection", "LLM guardrails", "deterministic verification", "semantic caching", "self-hosted", "audit logging", "compliance", "HIPAA", "GDPR", "SOC2"]
readme = "README.md"
authors = [{name = "CertainLogic", email = "ops@certainlogic.ai"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
semantic_cache = ["sentence-transformers>=2.2.0"]
langchain = ["langchain-core>=0.2.0"]
dev = ["black", "ruff", "pytest", "pytest-cov", "coverage", "isort", "pre-commit"]

[tool.setuptools.package-data]
hallucination_guard = ["facts_db.json"]

[project.scripts]
hallucination-guard = "hallucination_guard.__main__:main"

[project.urls]
Homepage = "https://certainlogic.ai"
Repository = "https://github.com/CertainLogicAI/hallucination-guard"
Documentation = "https://github.com/CertainLogicAI/hallucination-guard#readme"
Changelog = "https://github.com/CertainLogicAI/hallucination-guard/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/CertainLogicAI/hallucination-guard/issues"

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py38"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "Q", "W"]
ignore = ["E301", "E251", "E203", "E701", "E902", "E501"]